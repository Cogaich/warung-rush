<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Warung Rush: run a nasi goreng stall for one 3-minute shift — chop, fry, plate and serve before the customers walk out.">
<title>Warung Rush — The Fastest Fried Rice on the Street</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Warung Rush: serve nasi goreng orders — grab ingredients, chop, fry in the wok, plate, serve"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
